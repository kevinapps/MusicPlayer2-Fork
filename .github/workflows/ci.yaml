name: CI
run-name: CI
# Controls when the action will run.
# Events list: https://docs.github.com/en/actions/reference/events-that-trigger-workflows
# on: [push, pull_request, workflow_dispatch]
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-2022
    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: 设置 msbuild
        uses: microsoft/setup-msbuild@v3
      - name: 编译
        run: msbuild -t:Build '-p:Configuration=Release;platform=x64' -m:4
      - name: 复制文件到 Release 文件夹
        run: cp -R ./MusicPlayer2/language/ ./x64/Release/

      - name: Generate version number and package into zip file
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $ver = "${{ github.ref_name }}"
          } else {
            $ver = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

          $zipName = "Musicplayer2_${ver}_x64.zip"
          Compress-Archive -Path ./x64/Release/*.exe, ./x64/Release/*.dll, ./x64/Release/language `
            -DestinationPath "./$zipName"
          echo "zipname=$zipName" >> $env:GITHUB_OUTPUT

      - name: 上传文件
        uses: actions/upload-artifact@v7
        with:
          name: MusicPlayer2.x64
          path: ${{ steps.version.outputs.zipname }}

      - name: 打包其他文件
        run: |
          cd x64/Release
          7z a -mx9 '../../MusicPlayer2.x64.other.7z' '-x!*.exe' '-x!*.dll' './*'
      - name: 上传其他文件
        uses: actions/upload-artifact@v7
        with:
          name: MusicPlayer2.x64.other
          path: ./MusicPlayer2.x64.other.7z

  build-x86:
    runs-on: windows-2022
    steps:
      - name: Check Out
        uses: actions/checkout@v7

      - name: 设置 msbuild
        uses: microsoft/setup-msbuild@v3
      - name: 编译
        run: msbuild -t:Build '-p:Configuration=Release;platform=x86' -m:4
      - name: 复制文件到 Release 文件夹
        run: cp -R ./MusicPlayer2/language/ ./Release/

      - name: Generate version number and package into zip file
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $ver = "${{ github.ref_name }}"
          } else {
            $ver = "dev-$($env:GITHUB_SHA.Substring(0,7))"
          }
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

          $zipName = "Musicplayer2_${ver}_x86.zip"
          Compress-Archive -Path ./Release/*.exe, ./Release/*.dll, ./Release/language `
            -DestinationPath "./$zipName"
          echo "zipname=$zipName" >> $env:GITHUB_OUTPUT

      - name: 上传文件
        uses: actions/upload-artifact@v7
        with:
          name: MusicPlayer2.x86
          path: ${{ steps.version.outputs.zipname }}

      - name: 打包其他文件
        run: |
          cd Release
          7z a -mx9 './../MusicPlayer2.x86.other.7z' '-x!*.exe' '-x!*.dll' './*'
      - name: 上传其他文件
        uses: actions/upload-artifact@v7
        with:
          name: MusicPlayer2.x86.other
          path: ./MusicPlayer2.x86.other.7z

  release:
    needs: [build-x64, build-x86]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: MusicPlayer2.x64
          path: ./dist

      - name: Download x86 artifact
        uses: actions/download-artifact@v8
        with:
          name: MusicPlayer2.x86
          path: ./dist

      - name: Publish to Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/*.zip